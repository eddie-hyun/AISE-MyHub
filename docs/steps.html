<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyHub 개발 여정 — 전체 타임라인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --bg-soft:#f7f8fa; --bg-code:#f4f5f7;
    --fg:#1b1f24; --fg-soft:#5b6570; --fg-faint:#8b949e;
    --line:#e3e6ea; --line-strong:#cfd4da;
    --accent:#2f7d5d; --accent-bg:#eef7f2; --accent-line:#c4e2d3;
    --warn:#946200;  --warn-bg:#fdf6e6;   --warn-line:#ecd9a8;
    --mono:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,"D2Coding",monospace;
    --s1:#2f7d5d; --s1-bg:#eef7f2;
    --s2:#2f6f9c; --s2-bg:#eaf3fa;
    --s3:#8a5cc7; --s3-bg:#f3eefb;
    --s4:#c2790f; --s4-bg:#fbf1e2;
    --s5:#c0405a; --s5-bg:#fbebee;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171a; --bg-soft:#1b1f23; --bg-code:#1e2328;
      --fg:#e7eaee; --fg-soft:#a4adb8; --fg-faint:#7b8592;
      --line:#2a2f36; --line-strong:#3a414a;
      --accent:#5fbf92; --accent-bg:#16241e; --accent-line:#2c4a3c;
      --warn:#e0b155;  --warn-bg:#241f14;  --warn-line:#4a3d22;
      --s1:#5fbf92; --s1-bg:#16241e;
      --s2:#6fb2e6; --s2-bg:#152531;
      --s3:#b795ea; --s3-bg:#251f33;
      --s4:#e8b357; --s4-bg:#2c2115;
      --s5:#ea8398; --s5-bg:#2c1a1e;
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:"Noto Sans KR",sans-serif;
    font-size:16px; line-height:1.6;
    word-break:keep-all; overflow-wrap:anywhere;
  }
  .wrap{width:min(760px, 92%); margin:0 auto; padding:40px 0 96px}

  header.top{margin-bottom:8px}
  .eyebrow{color:var(--accent); font-weight:700; font-size:.8rem; letter-spacing:.09em; text-transform:uppercase; margin:0 0 10px}
  h1{font-size:1.8rem; line-height:1.32; margin:0 0 10px; letter-spacing:-.02em; font-weight:900}
  .lede{color:var(--fg-soft); margin:0 0 4px; font-size:.98rem}

  .instructions{
    background:var(--bg-soft); border:1px solid var(--line); border-radius:12px;
    padding:14px 18px; margin:20px 0 36px; font-size:.9rem; color:var(--fg-soft);
    display:flex; gap:10px; align-items:flex-start;
  }
  .instructions .ic{flex:none; font-size:1.1rem; line-height:1}
  .instructions b{color:var(--fg)}

  .progress-bar{
    position:sticky; top:0; z-index:5; background:var(--bg);
    padding:10px 0 14px; margin-bottom:8px; border-bottom:1px solid var(--line);
  }
  .progress-track{height:8px; border-radius:99px; background:var(--bg-soft); border:1px solid var(--line); overflow:hidden}
  .progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--s1),var(--s5)); transition:width .35s ease}
  .progress-label{display:flex; justify-content:space-between; font-size:.78rem; color:var(--fg-faint); margin-top:6px}
  .progress-label b{color:var(--accent); font-weight:700}
  .reset-btn{
    background:none; border:1px solid var(--line-strong); color:var(--fg-soft);
    font-family:inherit; font-size:.74rem; padding:3px 10px; border-radius:99px; cursor:pointer;
  }
  .reset-btn:hover{color:var(--fg); border-color:var(--fg-faint)}

  .timeline{position:relative; margin-top:20px; padding-left:34px}
  .rail{position:absolute; left:13px; top:6px; bottom:6px; width:2px; background:var(--line)}

  .step-group{position:relative; margin-bottom:6px}
  .step-head{
    position:relative; display:flex; align-items:center; gap:12px;
    margin:34px 0 14px; padding-left:0;
  }
  .step-group:first-child .step-head{margin-top:0}
  .step-badge{
    position:absolute; left:-34px; width:28px; height:28px; border-radius:50%;
    display:grid; place-items:center; font-weight:900; font-size:.78rem;
    background:var(--dot-bg); color:var(--dot-fg); border:3px solid var(--bg);
    box-shadow:0 0 0 2px var(--dot-bg);
  }
  .step-title{font-weight:900; font-size:1.08rem; letter-spacing:-.01em}
  .step-title small{display:block; font-weight:500; font-size:.8rem; color:var(--fg-faint); margin-top:1px}

  .item{
    position:relative; margin:0 0 10px; border-radius:12px;
    border:1px solid var(--line); background:var(--bg-soft);
    transition:border-color .15s, background .15s, transform .1s;
  }
  .item-btn{
    all:unset; box-sizing:border-box; display:block; width:100%; cursor:pointer;
    padding:12px 16px 12px 18px;
  }
  .item-dot{
    position:absolute; left:-30px; top:18px; width:12px; height:12px; border-radius:50%;
    background:var(--bg); border:2px solid var(--line-strong); transition:all .15s;
  }
  .item-row{display:flex; align-items:baseline; gap:10px; margin-bottom:3px; flex-wrap:wrap}
  .item-num{font-family:var(--mono); font-size:.72rem; font-weight:700; color:var(--fg-faint); flex:none}
  .item-title{font-weight:700; font-size:.96rem; color:var(--fg)}
  .item-desc{font-size:.85rem; color:var(--fg-soft); margin:0}
  .item-prompt{
    margin:10px 0 0; padding:10px 13px; border-radius:8px;
    background:var(--bg-code); border:1px solid var(--line);
    font-family:var(--mono); font-size:.74rem; line-height:1.6;
    color:var(--fg-soft); white-space:pre-wrap; overflow-x:auto;
  }
  .item-prompt b{display:block; font-family:"Noto Sans KR",sans-serif; font-size:.7rem; font-weight:700; letter-spacing:.04em; color:var(--accent); margin:0 0 6px}
  .item-tag{
    margin-left:auto; flex:none; font-size:.68rem; font-weight:700; letter-spacing:.05em;
    padding:2px 9px; border-radius:99px; color:var(--fg-faint); background:var(--bg);
    border:1px solid var(--line); opacity:0; transition:opacity .15s;
  }
  .item.done{opacity:.62}
  .item.done .item-dot{background:var(--accent); border-color:var(--accent)}
  .item.done .item-tag{opacity:1; color:var(--accent); border-color:var(--accent-line); background:var(--accent-bg)}

  .item.current{
    border-color:var(--accent); background:var(--accent-bg);
    box-shadow:0 2px 14px -4px rgba(0,0,0,.18);
  }
  .item.current .item-dot{
    background:var(--accent); border-color:var(--accent); width:16px; height:16px; left:-32px; top:16px;
    box-shadow:0 0 0 4px var(--accent-bg), 0 0 0 5px var(--accent-line);
    animation:pulse 1.8s ease-in-out infinite;
  }
  .item.current .item-title{color:var(--accent)}
  .item.current .item-tag{opacity:1; color:var(--bg); background:var(--accent); border-color:var(--accent)}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 4px var(--accent-bg), 0 0 0 5px var(--accent-line)}
    50%{box-shadow:0 0 0 7px var(--accent-bg), 0 0 0 8px var(--accent-line)}
  }

  .item:not(.current):not(.done) .item-btn:hover{}
  .item:not(.current) .item-btn:hover ~ .item-dot,
  .item:not(.current):hover{border-color:var(--fg-faint)}

  .item-foot{
    display:flex; justify-content:flex-end; padding:0 16px 10px 18px; margin-top:-4px;
  }
  .item-link{font-size:.76rem; color:var(--accent); text-decoration:none; font-weight:500}
  .item-link:hover{text-decoration:underline}

  .foot{margin-top:56px; padding-top:20px; border-top:1px solid var(--line); color:var(--fg-faint); font-size:.85rem}
  .foot a{color:var(--accent)}

  @media (max-width:520px){
    .wrap{width:94%}
    h1{font-size:1.5rem}
    .item-tag{display:none}
  }
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <p class="eyebrow">MyHub · 온라인 이력서 만들기</p>
  <h1>전체 개발 여정 타임라인</h1>
  <p class="lede">Step 1 ~ 5, 총 41개의 작은 단계입니다.</p>
</header>

<div class="instructions">
  <span class="ic">👆</span>
  <div><b>단계를 클릭하면 "지금 여기"로 표시됩니다.</b> 그 앞 단계는 완료 표시로 흐려지고, 진행 막대가 갱신됩니다. 새로고침해도 표시가 유지됩니다. 각 항목의 <b>바로가기</b>를 누르면 해당 문서로 이동합니다.</div>
</div>

<div class="progress-bar">
  <div class="progress-track"><div class="progress-fill" id="fill"></div></div>
  <div class="progress-label">
    <span id="label">아직 표시된 위치가 없습니다</span>
    <button class="reset-btn" id="resetBtn" type="button">표시 지우기</button>
  </div>
</div>

<div class="timeline">
  <div class="rail"></div>
  <div id="groups"></div>
</div>

<p class="foot">MyHub 개발 기록 · 전체 타임라인 · <a href="README.html">README로 돌아가기</a></p>

</div>

        ['4-3', '① 백엔드 — 로그인과 수정 엔드포인트', 's3', '세션 로그인 3종 엔드포인트와 PUT /api/profile 수정 엔드포인트 구현'],
        ['4-4', '② 프론트엔드 — 제자리 편집', 's4', '로그인 상태에 따라 읽기 화면과 편집 화면을 전환하는 로직 구현'],
        ['4-5', '코드 전체', 's5', '완성된 백엔드·프론트엔드 코드 전체를 한 번에 수록'],
        ['4-6', '이번에 배운 개념', 's6', '세션, SessionMiddleware, Depends, RETURNING 등 핵심 용어 요약'],
        ['4-7', '다음 단계 (Step 5)', 's7', 'raw SQL 대신 ORM으로 데이터베이스를 다루는 다음 목표를 예고'],
      ]
    },
    {
      key: 'step5', title: 'Step 5 — ORM 도입 (SQLAlchemy)', file: 'step5_orm_sqlalchemy.html',
      items: [
        ['5-1', '이 단계의 목표', 's1', 'raw SQL 대신 파이썬 클래스로 데이터베이스를 다루게 만드는 것이 목표. AI 코딩 에이전트에게 준 프롬프트로 진행',
          '이제는 SQLAlchemy를 도입하여 데이터 접근을 오브젝트 방식으로 변경할 것임.\n\n* 마이그레이션과 스키마 관리는 불필요함.\n* 현재의 테이블 정의를 파이썬 엔티티 클래스를 만들어서 이전.\n* 서버가 시작할 때 엔티티 기준으로 없는 테이블은 자동 생성하고 새 테이블은 비어있으니 초기 데이터 1건을 insert.\n* 기존에 구현된 기능들의 데이터베이스 접근을 raw SQL 대신 ORM 호출로 교체.\n* API의 주소와 응답 모양(OpenAPI 스펙)은 그대로 둠.\n* db.py, models.py, schemas.py 로 구현 내용을 적절히 분리하여야 함.'],
        ['5-2', 'ORM 이 뭐고, 왜 쓰나', 's2', 'ORM 개념을 소개하고 얻는 것과 잃는 것을 솔직하게 비교'],
        ['5-3', '① 설치 · 파일 분리 · 엔티티 정의', 's3', 'SQLAlchemy를 설치하고 db.py / models.py / schemas.py로 파일 분리'],
        ['5-4', '② 테이블 자동 생성과 seed', 's4', '서버 시작 시 테이블을 자동 생성하고 없으면 초기 데이터 1건을 입력'],
        ['5-5', '③ 엔드포인트를 ORM 으로', 's5', '엔드포인트의 raw SQL 쿼리를 전부 ORM 호출로 교체'],
        ['5-6', '④ 정리', 's6', '최종 파일 구조를 정리하고 프론트엔드가 영향받지 않았음을 확인'],
        ['5-7', '이번에 배운 개념', 's7', '엔티티, 세션, 더티 트래킹 등 ORM 핵심 용어를 표로 요약'],
        ['5-8', '여기까지의 여정', 's8', 'Step 1~5 전체 여정을 되짚고 다음 확장 방향을 제시하며 마무리'],
      ]
    },
  ];

  var STORAGE_KEY = 'myhub-timeline-current';
  var flat = [];
  STEPS.forEach(function(step, si){
    step.items.forEach(function(item, ii){
      flat.push({ stepIndex: si, itemIndex: ii, id: step.key + '-' + item[0] });
    });
  });

  var groupsEl = document.getElementById('groups');
  var fillEl = document.getElementById('fill');
  var labelEl = document.getElementById('label');

  function badgeVars(si){ return 'var(--s' + (si+1) + ')'; }

  function escapeHtml(str){
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  STEPS.forEach(function(step, si){
    var group = document.createElement('div');
    group.className = 'step-group';

    var head = document.createElement('div');
    head.className = 'step-head';
    head.innerHTML =
      '<span class="step-badge" style="--dot-bg:' + badgeVars(si) + ';--dot-fg:var(--bg)">' + (si+1) + '</span>' +
      '<span class="step-title">' + step.title + '<small>' + step.items.length + '개 단계 · <a href="' + step.file + '" style="color:inherit">문서 전체 보기 →</a></small></span>';
    group.appendChild(head);

    step.items.forEach(function(item, ii){
      var id = step.key + '-' + item[0];
      var el = document.createElement('div');
      el.className = 'item';
      el.id = 'row-' + id;
      var promptHtml = item[4]
        ? '<div class="item-prompt"><b>예제 프롬프트</b>' + escapeHtml(item[4]) + '</div>'
        : '';
      el.innerHTML =
        '<button type="button" class="item-btn" data-id="' + id + '">' +
          '<div class="item-row">' +
            '<span class="item-num">' + item[0] + '</span>' +
            '<span class="item-title">' + item[1] + '</span>' +
            '<span class="item-tag">지금 여기</span>' +
          '</div>' +
          '<p class="item-desc">' + item[3] + '</p>' +
          promptHtml +
        '</button>' +
        '<div class="item-foot"><a class="item-link" href="' + step.file + '#' + item[2] + '">문서에서 보기 →</a></div>' +
        '<span class="item-dot"></span>';
      group.appendChild(el);
    });

    groupsEl.appendChild(group);
  });

  function findFlatIndex(id){
    for (var i = 0; i < flat.length; i++) if (flat[i].id === id) return i;
    return -1;
  }

  function render(currentId){
    var currentFlatIdx = currentId ? findFlatIndex(currentId) : -1;

    flat.forEach(function(entry, idx){
      var el = document.getElementById('row-' + entry.id);
      var tagEl = el.querySelector('.item-tag');
      el.classList.remove('current', 'done');
      if (currentFlatIdx === -1) { tagEl.textContent = '지금 여기'; return; }
      if (idx < currentFlatIdx) { el.classList.add('done'); tagEl.textContent = '완료'; }
      else if (idx === currentFlatIdx) { el.classList.add('current'); tagEl.textContent = '지금 여기'; }
      else { tagEl.textContent = '지금 여기'; }
    });

    if (currentFlatIdx === -1) {
      fillEl.style.width = '0%';
      labelEl.textContent = '아직 표시된 위치가 없습니다';
    } else {
      var pct = Math.round(((currentFlatIdx + 1) / flat.length) * 100);
      fillEl.style.width = pct + '%';
      var entry = flat[currentFlatIdx];
      var step = STEPS[entry.stepIndex];
      var item = step.items[entry.itemIndex];
      labelEl.innerHTML = '지금 여기: <b>' + item[0] + ' ' + item[1] + '</b> · 전체 ' + (currentFlatIdx+1) + '/' + flat.length + ' (' + pct + '%)';
    }
  }

  function setCurrent(id){
    var same = localStorage.getItem(STORAGE_KEY) === id;
    if (same) {
      localStorage.removeItem(STORAGE_KEY);
      render(null);
    } else {
      localStorage.setItem(STORAGE_KEY, id);
      render(id);
    }
  }

  groupsEl.addEventListener('click', function(e){
    var btn = e.target.closest('.item-btn');
    if (!btn) return;
    setCurrent(btn.dataset.id);
  });

  document.getElementById('resetBtn').addEventListener('click', function(){
    localStorage.removeItem(STORAGE_KEY);
    render(null);
  });

  render(localStorage.getItem(STORAGE_KEY));
})();
</script>
</body>
</html>
